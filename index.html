<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Kratos: trainer dan pemantau latihan gym pribadi" />
    <link rel="icon" href="/icons/kratos.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kratos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Kratos</title>
    <script>
      // Pasang tema sebelum halaman digambar agar tidak berkedip (lihat src/shared/lib/theme.ts).
      try {
        var theme = localStorage.getItem('kratos:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
