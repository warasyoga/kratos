  <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="28"/>
  <circle cx="256" cy="256" r="30" fill="#FFFFFF" fill-opacity="0.14"/>
  <!-- Huruf K, di dalam zona aman 80% -->
  <rect x="170" y="140" width="52" height="232" rx="4" fill="#FFFFFF"/>
  <polygon points="222,236 312,140 374,140 222,304" fill="#FFFFFF"/>
  <polygon points="244,276 286,236 380,372 316,372" fill="#FFFFFF"/>
